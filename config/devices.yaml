# DM-NAX DSP Test Suite Configuration
# Device profiles - add new devices here
devices:
  DM-NAX-4ZSA:
    ip: "192.168.1.157"
    username: "admin"
    password: "admin123"
    model: "4ZSA"
    zones: 4
    amp_outputs: ["A1L","A1R","A2L","A2R","A3L","A3R","A4L","A4R"]
    line_outputs: ["L1L","L1R"]
    network_outputs: ["N1L","N1R","N2L","N2R","N3L","N3R","N4L","N4R"]
    physical_inputs:
      S1: { channels: ["S1L","S1R"], index: [0,1], type: "stream" }
      T1: { channels: ["T1L","T1R"], index: [2,3], type: "stream" }
      L1: { channels: ["L1L","L1R"], index: [4,5], type: "line", has_adc: true }
      L2: { channels: ["L2L","L2R"], index: [6,7], type: "line", has_adc: true }
    signal_generator: { channel: 28, name: "SIG" }
    mixer_outputs: 10
    dsp_fw_version: 21
    has_speaker_protect: false
    ssh_port: 22
    # Input01 (T1/TOSLINK) is physically silent without a cable connected.
    # Setting zones to Input01 gives CresNext a valid source assignment while
    # keeping the internal tone generator (ch28) as the sole audio source.
    dsp_tone_input: "Input01"
    streaming:
      base_port: 60001
      # Zone → streaming input → player port → test tone frequency
      # Input05-08 = MediaStream1-4 on 4ZSA (ports 60001-60004)
      zones:
        1: { input: "Input05", port: 60001, tone_hz: 100 }
        2: { input: "Input06", port: 60002, tone_hz: 200 }
        3: { input: "Input07", port: 60003, tone_hz: 400 }
        4: { input: "Input08", port: 60004, tone_hz: 800 }
      audio_server_port: 8088

  DM-NAX-8ZSA:
    ip: "192.168.1.178"
    username: "admin"
    password: "crestron"
    model: "8ZSA"
    zones: 8
    amp_outputs: ["A1L","A1R","A2L","A2R","A3L","A3R","A4L","A4R","A5L","A5R","A6L","A6R","A7L","A7R","A8L","A8R"]
    line_outputs: ["L1L","L1R"]
    network_outputs: ["N1L","N1R","N2L","N2R","N3L","N3R","N4L","N4R"]
    physical_inputs:
      S1: { channels: ["S1L","S1R"], index: [0,1], type: "stream" }
      T1: { channels: ["T1L","T1R"], index: [2,3], type: "stream" }
      L1: { channels: ["L1L","L1R"], index: [4,5], type: "line", has_adc: true }
      L2: { channels: ["L2L","L2R"], index: [6,7], type: "line", has_adc: true }
    # fw42 on 8ZSA exposes tone control on physical channels (0-7).
    # Use ch0 (S1L/Input01) for DSP tone tests.
    signal_generator: { channel: 0, name: "S1L" }
    mixer_outputs: 8
    dsp_fw_version: 42
    has_speaker_protect: true
    ssh_port: 22
    # AvMatrixRouting input that carries the internal DSP bus (tone gen / mixer).
    # DSP tone-generator tests route zones here so signal reaches amp outputs.
    # Input01 (S1/SPDIF) is physically silent when no cable is connected,
    # letting the internal signal generator be the sole audio source.
    dsp_tone_input: "Input01"
    engineering_debug:
      auto_enable_for_streaming: true
      # Zip source on Linux build server is resolved from mounted path:
      # /mnt/nightly/AM335x_dinap3/eng_dbg
      # (UNC fallback is used only if mount is unavailable.)
      zip_file: ""
      search_roots: []
      # Optional SMB credentials for the UNC share (if anonymous access is denied).
      smb_username: "builduser"
      smb_password: "password"
      smb_domain: ""
      set_current_datetime: false
      remote_zip_path: "firmware/engineering_debug.zip"
    streaming:
      base_port: 60001
      # Input05-12 = MediaStream1-8 on 8ZSA (ports 60001-60008)
      zones:
        1: { input: "Input05", port: 60001, tone_hz: 100 }
        2: { input: "Input06", port: 60002, tone_hz: 200 }
        3: { input: "Input07", port: 60003, tone_hz: 400 }
        4: { input: "Input08", port: 60004, tone_hz: 800 }
        5: { input: "Input09", port: 60005, tone_hz: 1500 }
        6: { input: "Input10", port: 60006, tone_hz: 3000 }
        7: { input: "Input11", port: 60007, tone_hz: 6000 }
        8: { input: "Input12", port: 60008, tone_hz: 12000 }
      audio_server_port: 8088

  DM-NAX-4ZSP:
    ip: "dm-nax-4zsp-00107fca06ff"
    username: "admin"
    password: "crestron"
    model: "4ZSP"
    zones: 8
    amp_outputs: ["A1L","A1R","A2L","A2R","A3L","A3R","A4L","A4R","A5L","A5R","A6L","A6R","A7L","A7R","A8L","A8R"]
    line_outputs: ["L1L","L1R"]
    network_outputs: ["N1L","N1R","N2L","N2R","N3L","N3R","N4L","N4R"]
    physical_inputs:
      # fw42 DSP: two 8-channel blocks (ch 0-7 = DSP0, ch 8-15 = DSP1)
      T1: { channels: ["T1L","T1R"], index: [0,1], type: "stream" }
      S1: { channels: ["S1L","S1R"], index: [2,3], type: "stream" }
      A1: { channels: ["A1L","A1R"], index: [4,5], type: "line", has_adc: true }
      A2: { channels: ["A2L","A2R"], index: [6,7], type: "line", has_adc: true }
      T2: { channels: ["T2L","T2R"], index: [8,9], type: "stream" }
      S2: { channels: ["S2L","S2R"], index: [10,11], type: "stream" }
      A3: { channels: ["A3L","A3R"], index: [12,13], type: "line", has_adc: true }
      A4: { channels: ["A4L","A4R"], index: [14,15], type: "line", has_adc: true }
    signal_generator: { channel: 0, name: "T1L" }  # fw42: no dedicated SG ch28, use input ch 0
    mixer_outputs: 16
    dsp_fw_version: 42
    has_speaker_protect: true
    ssh_port: 22
    # AvMatrixRouting input for tone-gen tests.  On 4ZSP the signal generator
    # IS Input01 (T1L, ch0) — routing zones here lets the tone flow through.
    dsp_tone_input: "Input01"
    streaming:
      base_port: 60001
      # Input05-12 = MediaStream1-8 on 4ZSP (ports 60001-60008), same as 8ZSA
      zones:
        1: { input: "Input05", port: 60001, tone_hz: 100 }
        2: { input: "Input06", port: 60002, tone_hz: 200 }
        3: { input: "Input07", port: 60003, tone_hz: 400 }
        4: { input: "Input08", port: 60004, tone_hz: 800 }
        5: { input: "Input09", port: 60005, tone_hz: 1500 }
        6: { input: "Input10", port: 60006, tone_hz: 3000 }
        7: { input: "Input11", port: 60007, tone_hz: 6000 }
        8: { input: "Input12", port: 60008, tone_hz: 12000 }
      audio_server_port: 8088

# Zone selection profiles for runtime filtering.
# full mode = all zones on the device.
# quick mode = representative subset for faster regression runs.
zone_profiles:
  quick:
    DM-NAX-8ZSA: [2, 4, 5, 8]
    DM-NAX-4ZSP: [2, 4, 5, 8]
    DM-NAX-4ZSA: [1, 3]

# Firmware upgrade settings
firmware:
  # Default firmware_dir used when a device does not define its own.
  # On the build server the nightly drop dirs are mounted under /mnt/nightly/.
  # On the dev machine update this to your local path.
  firmware_dir: "/home/builduser/Linux_jstr1000/nightly_testing"
  remote_dir: "firmware"          # remote directory on device for SFTP upload
  # firmware_file: ""             # explicit path override (auto-detected if empty)
  # method_override: ""           # force "imgupd" or "puf" regardless of model

  # Per-device firmware directories (override firmware_dir above per model).
  # Build server mount points:
  #   DM-NAX-4ZSA  →  /mnt/nightly/DM-NAX-4ZSA   (.zip files)
  #   DM-NAX-8ZSA  →  /mnt/nightly/DM-NAX         (.puf files)
  #   DM-NAX-4ZSP  →  /mnt/nightly/DM-NAX         (.puf files)
  firmware_dirs:
    DM-NAX-4ZSA: "/mnt/nightly/DM-NAX-4ZSA"
    DM-NAX-8ZSA: "/mnt/nightly/DM-NAX"
    DM-NAX-4ZSP: "/mnt/nightly/DM-NAX"

# Test execution settings
test_settings:
  signal_settle_time_s: 1.5
  level_tolerance_db: 1.0
  mute_floor_db: -110.0
  default_tone_freq_hz: 1000
  default_tone_gain_db: -20
  max_retries: 2
  retry_delay_s: 2.0

# Web dashboard settings
dashboard:
  host: "0.0.0.0"
  port: 5000
  results_dir: "results"
  max_history: 90  # days to keep

# Report settings
report:
  company_name: "Crestron Electronics"
  product_line: "DM-NAX"
  logo_url: ""
